[package]
name = "cpu_monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.axum]
version = "0.8"
features = ["tokio"]

[dependencies.tokio]
version = "1"
features = ["full"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
